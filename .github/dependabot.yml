# Atualização semanal de dependências (ver docs/esteira_deploy.md, seção 3.2).
# Minor e patch de cada ecossistema vêm juntos num PR só; cada major vem num PR separado, porque major
# pode quebrar o build (ex.: TypeScript 7 não funciona com o typescript-eslint nem com o openapi-typescript)
# e precisa ser decidido à mão. Dependência fora de um grupo vira um PR próprio, e é isso que acontece com
# o major (o grupo só aceita `minor` e `patch`).
# Os Dockerfiles e os compose (docker/) usam as imagens oficiais (node:24-alpine, caddy:2-alpine) com a
# versão escrita no próprio FROM/image, para o Dependabot enxergar e propor as atualizações de segurança.
# Major de PostGIS e Garage fica fora: exige migração de dados, feita à mão.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # O Better Auth e os pacotes dele andam juntos (versões fixas e iguais): atualizam no mesmo PR
      better-auth:
        patterns: ['better-auth', '@better-auth/*']
        update-types: ['minor', 'patch']
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # O @better-auth/core exige better-call exatamente na 1.4.0 (peer fixo): qualquer outra versão quebra o
      # peer. Tire daqui quando o better-auth liberar uma versão que aceite a nova.
      - dependency-name: better-call

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
    groups:
      docker-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: imresamu/postgis
        update-types: ['version-update:semver-major']
      - dependency-name: dxflrs/garage
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
    groups:
      docker-compose-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: imresamu/postgis
        update-types: ['version-update:semver-major']
      - dependency-name: dxflrs/garage
        update-types: ['version-update:semver-major']
