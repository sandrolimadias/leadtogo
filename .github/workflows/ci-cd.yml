# Esteira de CI/CD (docs/esteira_deploy.md, seção 5).
#   escopo → quality + test(+E2E) + security → build (GHCR, ARM64 nativo) → deploy (Coolify) → verify → limpeza
#
# TEMPORÁRIO (docs/esteira_deploy.md, seção 5.4), até o runner próprio do homelab: pouca cota de minutos no mês.
# Push na main roda só escopo → quality → build → deploy → verify; test (com E2E) e security só por
# workflow_dispatch. O gate completo roda antes do push, no hook pre-push (numa cópia limpa do commit).
# Para voltar ao normal, desfaça os trechos marcados com "TEMPORÁRIO".
# Todas as actions são fixadas por SHA (versão no comentário); o Dependabot de actions atualiza os dois.
name: ci-cd

on:
  # TEMPORÁRIO: só a main dispara a esteira (nenhuma outra branch gasta minutos)
  push:
    branches: [main]
  # Só os PRs do Dependabot rodam algo (lint e tipos); PR de qualquer outro autor é ignorado
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um pipeline por branch. Na main NUNCA cancela um em andamento (poderia interromper um deploy no meio):
# o push seguinte espera o anterior terminar. Fora da main (PR do Dependabot), o run novo cancela o antigo.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  escopo:
    name: escopo
    if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    outputs:
      codigo: ${{ steps.classificar.outputs.codigo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classificar
        name: Só documentação?
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
          EVENTO: ${{ github.event_name }}
        run: |
          resultado=codigo
          if [ "$EVENTO" = push ] && [ -n "$ANTES" ] && ! [[ "$ANTES" =~ ^0+$ ]] \
             && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            resultado=$(git diff --name-only "$ANTES" "$DEPOIS" | bash scripts/escopo.sh)
          fi
          echo "Classificação: $resultado"
          if [ "$resultado" = codigo ]; then echo "codigo=true" >> "$GITHUB_OUTPUT"; else echo "codigo=false" >> "$GITHUB_OUTPUT"; fi

  # ---------------------------------------------------------------------------
  quality:
    needs: escopo
    if: needs.escopo.outputs.codigo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache do Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  # ---------------------------------------------------------------------------
  imagens:
    # As IMAGENS de produção no navegador (Caddy do web + CSP + API + Garage reais): pega o que o E2E de
    # desenvolvimento não vê, como o worker do mapa que não subia sob a CSP. Bloqueia o build/deploy.
    # Roda em todo push de código na main (docker/imagens-testar.sh; o mapa usa docker/fixtures/mapa-teste.pmtiles).
    needs: [escopo, quality]
    if: >-
      needs.escopo.outputs.codigo == 'true' && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request' && needs.quality.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Serviços (docker/dev-up.sh)
        run: |
          cp .env.example .env
          sed -i "s|^TOKEN_ENCRYPTION_KEY=.*|TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          bash docker/dev-up.sh
      - name: Chromium do Playwright
        run: pnpm --filter @leadtogo/web exec playwright install --with-deps chromium
      - name: Imagens de produção no navegador (pnpm imagens:testar)
        run: pnpm imagens:testar
      - name: Logs dos serviços (só se falhar)
        if: failure()
        run: docker compose -f docker/compose.dev.yml logs --no-color --tail 200

  # ---------------------------------------------------------------------------
  test:
    # TEMPORÁRIO: só por workflow_dispatch (o gate de todo push roda no pre-push, na máquina de quem envia)
    needs: escopo
    if: needs.escopo.outputs.codigo == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache do Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      # Os mesmos serviços do desenvolvimento (Postgres+PostGIS, Valkey, Garage e Mailpit), preparados pelo
      # mesmo script (bancos e papéis, layout/bucket/chave do Garage). As senhas do .env.example são só de teste.
      - name: Serviços (docker/dev-up.sh)
        run: |
          cp .env.example .env
          # Chave descartável deste run (o .env.example a deixa vazia; sem ela a fila de e-mail não funciona)
          sed -i "s|^TOKEN_ENCRYPTION_KEY=.*|TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          bash docker/dev-up.sh
      - name: Testes (migrações do zero, RLS e integração)
        # Uma tarefa por vez: o runner tem 2 vCPUs e os testes são CPU-bound (hash de senha, bootstrap do
        # Nest); api, db e web juntos deixavam os testes 3 a 5 vezes mais lentos e estouravam o prazo de 5 s
        env:
          TURBO_CONCURRENCY: '1'
        run: pnpm test
      - name: Migrar o banco de desenvolvimento (usado pelo E2E)
        run: pnpm db:migrate
      - name: Chromium do Playwright
        run: pnpm --filter @leadtogo/web exec playwright install --with-deps chromium
      - name: E2E (API, worker, Vite, Postgres, Valkey e Mailpit reais)
        run: pnpm --filter @leadtogo/web e2e
      - name: Relatório do Playwright (só se falhar)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-falhas
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Logs dos serviços (só se falhar)
        if: failure()
        run: docker compose -f docker/compose.dev.yml logs --no-color --tail 200

  # ---------------------------------------------------------------------------
  security:
    # TEMPORÁRIO: só por workflow_dispatch
    needs: escopo
    if: needs.escopo.outputs.codigo == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (alto e crítico)
        run: pnpm audit --audit-level high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  build:
    # Só na main (ou manual): publica no GHCR. Runner ARM nativo, sem QEMU (a VPS é ARM64).
    # TEMPORÁRIO: test e security ficam "skipped" no push; só "failure" ou "cancelled" nelas bloqueia o build
    needs: [escopo, quality, imagens, test, security]
    if: >-
      !cancelled() && needs.escopo.outputs.codigo == 'true' && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.quality.result == 'success'
      && needs.imagens.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.test.result)
      && contains(fromJSON('["success","skipped"]'), needs.security.result)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [api, web, portal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nome da imagem (minúsculas)
        id: img
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/leadtogo-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - id: data
        run: echo "build=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          platforms: linux/arm64
          push: true
          # Sem atestado de proveniência: ele cria versões "sem tag" no GHCR que a limpeza não pode distinguir
          provenance: false
          tags: |
            ${{ steps.img.outputs.nome }}:sha-${{ github.sha }}
            ${{ steps.img.outputs.nome }}:latest
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            BUILD_DATE=${{ steps.data.outputs.build }}
            VITE_SENTRY_DSN=${{ vars.SENTRY_DSN_WEB }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
          # Só o web usa: envia os source maps ao GlitchTip (sem o segredo cadastrado, o build não gera mapas)
          secrets: |
            ${{ matrix.app == 'web' && format('sentry_auth_token={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ---------------------------------------------------------------------------
  deploy:
    # Desligado até a E13: ligue a variável do repositório DEPLOY_ENABLED=true (Settings → Variables).
    needs: [escopo, build]
    # `!cancelled()` + resultado do build: o `success()` implícito pula o job se QUALQUER ancestral foi pulado
    # (test e security ficam "skipped" no push, no modo temporário), e o deploy nunca rodaria
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.escopo.outputs.codigo == 'true'
      && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy no Coolify (api, worker, web e portal)
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          # COOLIFY_UUID_PORTAL só existe depois de cadastrar o aplicativo do portal no Coolify (vazio, não dispara nada)
          UUIDS: ${{ secrets.COOLIFY_UUID_API }} ${{ secrets.COOLIFY_UUID_WORKER }} ${{ secrets.COOLIFY_UUID_WEB }} ${{ secrets.COOLIFY_UUID_PORTAL }}
        run: |
          for uuid in $UUIDS; do
            # A API do Coolify aceita só POST em /deploy (o GET antigo responde 405)
            resposta=$(curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$uuid&force=false")
            echo "deploy disparado: ${uuid:0:6}… ${resposta:0:200}"
          done

  # ---------------------------------------------------------------------------
  verify:
    # Teste de fumaça pelo caminho do usuário e pelo da integração
    needs: [escopo, deploy]
    if: >-
      !cancelled() && needs.escopo.outputs.codigo == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: A API nova responde com este commit (api.crm.aledias.com.br/health)
        env:
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS https://api.crm.aledias.com.br/health | grep -q "\"version\":\"$SHA\""; then
              echo "API na versão $SHA"; exit 0
            fi
            sleep 10
          done
          echo "::error::A nova versão não respondeu em 5 minutos"; exit 1
      # O Coolify troca api, worker e web ao mesmo tempo: o web pode levar alguns segundos a mais que a API
      # (e responder 503 enquanto o container novo não fica saudável). Tenta por até 5 minutos.
      - name: Web respondendo (crm.aledias.com.br)
        run: |
          for _ in $(seq 1 30); do
            codigo=$(curl -sS -o corpo.html -w '%{http_code}' https://crm.aledias.com.br/ || true)
            if [ "$codigo" = 200 ] && grep -qi '<div id="root"' corpo.html; then echo "web: HTTP $codigo"; exit 0; fi
            echo "web: HTTP $codigo, tentando de novo"; sleep 10
          done
          echo "::error::o web não respondeu o app em 5 minutos"; exit 1
      # Só quando o portal já foi cadastrado no Coolify: ligue a variável do repositório PORTAL_HOST (ex.: portal.aledias.com.br)
      - name: Portal respondendo (portal.aledias.com.br)
        if: vars.PORTAL_HOST != ''
        env:
          PORTAL_HOST: ${{ vars.PORTAL_HOST }}
        run: |
          for _ in $(seq 1 30); do
            codigo=$(curl -sS -o corpo.html -w '%{http_code}' "https://$PORTAL_HOST/" || true)
            if [ "$codigo" = 200 ] && grep -qi '<div id="root"' corpo.html; then
              echo "portal: HTTP $codigo"
              # o /v1/portal chega na API (a sessão sem cookie responde 401 nao_autenticado)
              curl -sS "https://$PORTAL_HOST/v1/portal/sessao" -o sessao.txt || true
              if grep -q 'nao_autenticado' sessao.txt; then echo "portal: /v1/portal chegou na API"; exit 0; fi
              echo "portal: /v1/portal ainda não chegou na API"
            else
              echo "portal: HTTP $codigo, tentando de novo"
            fi
            sleep 10
          done
          echo "::error::o portal não respondeu em 5 minutos"; exit 1
      - name: Rota pública /v1 pelo domínio do usuário (roteamento do Traefik)
        run: |
          for _ in $(seq 1 30); do
            curl -sS https://crm.aledias.com.br/v1/primeiro-acesso/estado -o estado.txt || true
            if grep -q '"aberto"' estado.txt; then cat estado.txt; echo; exit 0; fi
            echo "/v1 ainda não chegou na API, tentando de novo"; sleep 10
          done
          echo "::error::/v1 não chegou na API em 5 minutos"; exit 1

  # ---------------------------------------------------------------------------
  limpeza:
    # Apaga versões antigas no GHCR. Nunca toca em `latest`, na versão em produção nem na atual
    # (scripts/limpar-ghcr.sh). Falha aqui não derruba o pipeline.
    needs: [escopo, verify]
    if: >-
      !cancelled() && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versão em produção (lida do /health)
        id: prod
        run: |
          sha=$(curl -fsS https://api.crm.aledias.com.br/health | sed -n 's/.*"version":"\([0-9a-f]\{40\}\)".*/\1/p')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Em produção: ${sha:-desconhecida}"
      - name: Limpar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACOTES: leadtogo-api leadtogo-web leadtogo-portal
          PRODUCAO_SHA: ${{ steps.prod.outputs.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/limpar-ghcr.sh
