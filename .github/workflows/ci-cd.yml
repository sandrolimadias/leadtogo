# Esteira de CI/CD (docs/esteira_deploy.md, seção 5).
#   escopo → quality + test(+E2E) + security → build (GHCR, ARM64 nativo) → deploy (Coolify) → verify → limpeza
# Todas as actions são fixadas por SHA (versão no comentário); o Dependabot de actions atualiza os dois.
name: ci-cd

on:
  push:
  workflow_dispatch:

# Um pipeline por branch. Na main NUNCA cancela um em andamento (poderia interromper um deploy no meio):
# o push seguinte espera o anterior terminar.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  escopo:
    name: escopo
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.classificar.outputs.codigo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classificar
        name: Só documentação?
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
          EVENTO: ${{ github.event_name }}
        run: |
          resultado=codigo
          if [ "$EVENTO" = push ] && [ -n "$ANTES" ] && ! [[ "$ANTES" =~ ^0+$ ]] \
             && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            resultado=$(git diff --name-only "$ANTES" "$DEPOIS" | bash scripts/escopo.sh)
          fi
          echo "Classificação: $resultado"
          if [ "$resultado" = codigo ]; then echo "codigo=true" >> "$GITHUB_OUTPUT"; else echo "codigo=false" >> "$GITHUB_OUTPUT"; fi

  # ---------------------------------------------------------------------------
  quality:
    needs: escopo
    if: needs.escopo.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  # ---------------------------------------------------------------------------
  test:
    needs: escopo
    if: needs.escopo.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Os mesmos serviços do desenvolvimento (Postgres+PostGIS, Valkey, Garage e Mailpit), preparados pelo
      # mesmo script (bancos e papéis, layout/bucket/chave do Garage). As senhas do .env.example são só de teste.
      - name: Serviços (docker/dev-up.sh)
        run: |
          cp .env.example .env
          # Chave descartável deste run (o .env.example a deixa vazia; sem ela a fila de e-mail não funciona)
          sed -i "s|^TOKEN_ENCRYPTION_KEY=.*|TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          bash docker/dev-up.sh
      - name: Testes (migrações do zero, RLS e integração)
        # Uma tarefa por vez: o runner tem 2 vCPUs e os testes são CPU-bound (hash de senha, bootstrap do
        # Nest); api, db e web juntos deixavam os testes 3 a 5 vezes mais lentos e estouravam o prazo de 5 s
        env:
          TURBO_CONCURRENCY: '1'
        run: pnpm test
      - name: Migrar o banco de desenvolvimento (usado pelo E2E)
        run: pnpm db:migrate
      - name: Chromium do Playwright
        run: pnpm --filter @leadtogo/web exec playwright install --with-deps chromium
      - name: E2E (API, worker, Vite, Postgres, Valkey e Mailpit reais)
        run: pnpm --filter @leadtogo/web e2e
      - name: Relatório do Playwright (só se falhar)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-falhas
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Logs dos serviços (só se falhar)
        if: failure()
        run: docker compose -f docker/compose.dev.yml logs --no-color --tail 200

  # ---------------------------------------------------------------------------
  security:
    needs: escopo
    if: needs.escopo.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (alto e crítico)
        run: pnpm audit --audit-level high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  build:
    # Só na main (ou manual): publica no GHCR. Runner ARM nativo, sem QEMU (a VPS é ARM64).
    needs: [escopo, quality, test, security]
    if: needs.escopo.outputs.codigo == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nome da imagem (minúsculas)
        id: img
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/leadtogo-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - id: data
        run: echo "build=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          platforms: linux/arm64
          push: true
          # Sem atestado de proveniência: ele cria versões "sem tag" no GHCR que a limpeza não pode distinguir
          provenance: false
          tags: |
            ${{ steps.img.outputs.nome }}:sha-${{ github.sha }}
            ${{ steps.img.outputs.nome }}:latest
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            BUILD_DATE=${{ steps.data.outputs.build }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ---------------------------------------------------------------------------
  deploy:
    # Desligado até a E13: ligue a variável do repositório DEPLOY_ENABLED=true (Settings → Variables).
    needs: [escopo, build]
    if: needs.escopo.outputs.codigo == 'true' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy no Coolify (api, worker, web)
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUIDS: ${{ secrets.COOLIFY_UUID_API }} ${{ secrets.COOLIFY_UUID_WORKER }} ${{ secrets.COOLIFY_UUID_WEB }}
        run: |
          for uuid in $UUIDS; do
            curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$uuid&force=false" >/dev/null
            echo "deploy disparado: ${uuid:0:6}…"
          done

  # ---------------------------------------------------------------------------
  verify:
    # Teste de fumaça pelo caminho do usuário e pelo da integração
    needs: [escopo, deploy]
    if: needs.escopo.outputs.codigo == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: A API nova responde com este commit (api.crm.aledias.com.br/health)
        env:
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS https://api.crm.aledias.com.br/health | grep -q "\"version\":\"$SHA\""; then
              echo "API na versão $SHA"; exit 0
            fi
            sleep 10
          done
          echo "::error::A nova versão não respondeu em 5 minutos"; exit 1
      - name: Web respondendo (crm.aledias.com.br)
        run: |
          curl -fsS -o corpo.html -w 'web: HTTP %{http_code}\n' https://crm.aledias.com.br/
          grep -qi '<div id="root"' corpo.html || { echo "::error::a página inicial não parece o app"; exit 1; }
      - name: Rota pública /v1 pelo domínio do usuário (roteamento do Traefik)
        run: |
          curl -fsS -w '\n/v1: HTTP %{http_code}\n' https://crm.aledias.com.br/v1/primeiro-acesso/estado | tee estado.txt
          grep -q '"aberto"' estado.txt || { echo "::error::/v1 não chegou na API"; exit 1; }

  # ---------------------------------------------------------------------------
  limpeza:
    # Apaga versões antigas no GHCR. Nunca toca em `latest`, na versão em produção nem na atual
    # (scripts/limpar-ghcr.sh). Falha aqui não derruba o pipeline.
    needs: [escopo, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versão em produção (lida do /health)
        id: prod
        run: |
          sha=$(curl -fsS https://api.crm.aledias.com.br/health | sed -n 's/.*"version":"\([0-9a-f]\{40\}\)".*/\1/p')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Em produção: ${sha:-desconhecida}"
      - name: Limpar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACOTES: leadtogo-api leadtogo-web
          PRODUCAO_SHA: ${{ steps.prod.outputs.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/limpar-ghcr.sh
