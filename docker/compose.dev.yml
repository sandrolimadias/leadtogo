# Serviços de dados para desenvolvimento local (ver docs/esteira_deploy.md, seção 9.4).
#   pnpm dev:up   (= docker/dev-up.sh: sobe os serviços, garante os bancos/papéis e o init do Garage)
# Dados em docker/.data/ (ignorado pelo Git). Para zerar: pnpm dev:reset.
name: leadtogo-dev

services:
  postgres:
    image: imresamu/postgis:17-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: leadtogo
      # Senhas dos papéis criados por packages/db/sql/papeis.sql (iguais às do .env.example)
      LEADTOGO_OWNER_PASSWORD: ${LEADTOGO_OWNER_PASSWORD:-senha}
      LEADTOGO_APP_PASSWORD: ${LEADTOGO_APP_PASSWORD:-senha}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ../packages/db/sql:/sql:ro
      - ../packages/db/scripts:/scripts:ro
    healthcheck:
      # Por TCP (-h 127.0.0.1): o servidor temporário do init só escuta no socket e não pode contar como saudável
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d leadtogo']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - ./.data/valkey:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    environment:
      # Só para desenvolvimento; em produção o segredo fica no Coolify
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac968d39e4f8e5a5c}
    ports:
      - '127.0.0.1:3900:3900' # API S3 (as portas 3901 RPC e 3903 admin ficam só na rede interna)
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./.data/garage/meta:/var/lib/garage/meta
      - ./.data/garage/data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 20

  # Antivírus dos anexos dos chamados (ClamAV/clamd, porta 3310). Na primeira subida o freshclam baixa as
  # assinaturas (alguns minutos, ~300 MB): o healthcheck só fica verde depois disso. Os dados ficam em
  # docker/.data/clamav. Precisa de ~1,5 GB de RAM (o clamd carrega as assinaturas inteiras).
  # Fica num perfil à parte (`antivirus`): o `pnpm dev:up` o sobe sem esperar a primeira carga das assinaturas.
  clamav:
    image: clamav/clamav:1.5
    profiles: [antivirus]
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: 'false'
      # Os anexos aceitam até 25 MB: o clamd precisa aceitar fluxos desse tamanho
      CLAMD_CONF_StreamMaxLength: 30M
      CLAMD_CONF_MaxFileSize: 30M
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - ./.data/clamav:/var/lib/clamav
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  # Servidor SMTP de desenvolvimento: captura os e-mails (recuperação de senha, verificação,
  # convites) sem enviar nada. Interface e API em http://localhost:8025. Não guarda em disco.
  mailpit:
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # interface web e API HTTP
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
