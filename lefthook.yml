# Hooks locais (docs/esteira_deploy.md, seção 10). Instalados pelo `pnpm install` (script prepare).
rc: ./.lefthook.rc

pre-commit:
  parallel: false
  commands:
    segredos:
      run: pnpm exec secretlint --maskSecrets {staged_files}
    prettier:
      glob: '*.{js,mjs,cjs,ts,tsx,json,md,yml,yaml,css,html}'
      exclude:
        - 'docs/**'
        - 'pnpm-lock.yaml'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{js,mjs,cjs,ts,tsx}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional-commits:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    verificacao:
      # Push só de documentação (mesma regra do job `escopo` do CI: scripts/escopo.sh) não roda a suíte
      run: |
        if [ "$(bash scripts/escopo.sh {push_files} </dev/null)" = doc ]; then
          echo "Push só de documentação: lint, tipos e testes dispensados."
        else
          # Uma tarefa por vez, como no CI: api, db e web juntos disputam CPU no WSL e estouram prazos de teste
          pnpm lint && pnpm typecheck && TURBO_CONCURRENCY=1 pnpm test
        fi
