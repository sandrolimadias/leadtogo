packages:
  - apps/*
  - packages/*

# Peers opcionais (o better-auth declara drizzle-kit, vitest, jsdom, react...) NÃO são instalados sozinhos: sem
# isso o drizzle-kit e as ferramentas de teste entram na árvore de produção da imagem da API.
autoInstallPeers: false
# Cada pacote resolve os peers só com o que ELE declara (sem juntar as variantes de outros pacotes do workspace):
# senão o better-auth da API herda drizzle-kit, vitest e react do db e do web, e a imagem de produção os leva.
dedupePeerDependents: false
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.1'
  - '@typescript-eslint/parser@8.71.1'
  - '@typescript-eslint/project-service@8.71.1'
  - '@typescript-eslint/scope-manager@8.71.1'
  - '@typescript-eslint/tsconfig-utils@8.71.1'
  - '@typescript-eslint/type-utils@8.71.1'
  - '@typescript-eslint/types@8.71.1'
  - '@typescript-eslint/typescript-estree@8.71.1'
  - '@typescript-eslint/utils@8.71.1'
  - '@typescript-eslint/visitor-keys@8.71.1'
  - '@vitejs/plugin-react@6.1.2'
  - lefthook-darwin-arm64@2.1.17
  - lefthook-darwin-x64@2.1.17
  - lefthook-freebsd-arm64@2.1.17
  - lefthook-freebsd-x64@2.1.17
  - lefthook-linux-arm64@2.1.17
  - lefthook-linux-x64@2.1.17
  - lefthook-openbsd-arm64@2.1.17
  - lefthook-openbsd-x64@2.1.17
  - lefthook-windows-arm64@2.1.17
  - lefthook-windows-x64@2.1.17
  - lefthook@2.1.17
  - typescript-eslint@8.71.1
  - vite@8.3.3

# Dependências autorizadas a rodar scripts de instalação (pnpm bloqueia por padrão)
allowBuilds:
  '@swc/core': true
  esbuild: true
  lefthook: true
  '@scarf/scarf': false # telemetria do swagger-ui
  msgpackr-extract: false # aceleração opcional do bullmq; sem ela usa JS puro (e a imagem não precisa compilar nada)

# Correção de segurança de uma dependência transitiva de desenvolvimento (concurrently → shell-quote,
# GHSA-pqg4-j6r4-53mv, crítica em < 1.11.0). Remova quando o concurrently exigir a versão corrigida.
overrides:
  shell-quote: '>=1.11.0'
