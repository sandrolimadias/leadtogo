# Configuração do vroom-express para o serviço VROOM do Leadtogo (docs/geo_atualizacao.md, "OSRM e VROOM").
# Vai em /conf/config.yml do container (ghcr.io/vroom-project/vroom-docker:v1.14.0).
# O host 'leadtogo-osrm' é o nome do serviço no scripts/geo/rotas-compose.yml (mesma pilha, mesma rede).
cliArgs:
  geometry: false
  planmode: false
  threads: 2 # a VPS tem 4 CPUs ARM já perto de 50%
  explore: 5
  limit: '1mb'
  logdir: '/..'
  logsize: '100M'
  maxlocations: 40 # rota de no máximo 30 paradas + partida e chegada (com folga)
  maxvehicles: 1
  override: true
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 20000 # milissegundos; a API usa um prazo menor (ROTA_TEMPO_LIMITE_S)
  baseurl: '/'
routingServers:
  osrm:
    car:
      host: 'leadtogo-osrm'
      port: '5000'
